name: Mettre à jour la base des établissements

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 3 * *"   # le 3 de chaque mois à 4 h 17 (UTC)
  push:
    paths:
      - "build/**"
      - ".github/workflows/base.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: base
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install pyproj shapely
      - name: Construire la base
        run: python build/construire_base.py
      - name: Publier la base si elle a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Base inchangée."
          else
            git commit -m "Base des établissements du $(date +%d/%m/%Y)"
            git pull --rebase
            git push
            gh api --method POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
